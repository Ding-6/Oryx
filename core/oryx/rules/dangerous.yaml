# Oryx 危险命令规则
# 类别：
#   RCE —— 下载并执行、反弹 shell 等远程代码执行模式
#   NET —— 大量出网/上传、绕过网络的敏感操作
#   DEL —— 破坏性删除
#   SYS —— 修改系统核心配置
#   PAY —— 支付/资金相关（L3 硬边界，永不代执行）
# 匹配大小写不敏感。

rules:
  - id: RCE-001
    category: RCE
    description: 从远程下载脚本并管道给 shell 执行
    pattern: '(curl|wget|Invoke-WebRequest|iwr)\s+.+\|\s*(bash|sh|zsh|pwsh|powershell|cmd)'

  - id: RCE-002
    category: RCE
    description: 下载后直接执行
    pattern: '(Invoke-Expression|iex)\s*\(?\s*(New-Object\s+Net\.WebClient|curl|wget|Invoke-WebRequest)'

  - id: RCE-003
    category: RCE
    description: base64 解码后执行，规避检测的常见手法
    pattern: '(base64\s+(-d|--decode)|FromBase64String).*(\||IEX|iex|eval|bash|sh\b)'

  - id: RCE-004
    category: RCE
    description: 反弹 shell
    pattern: '(/dev/tcp/|nc\s+-e\s+|ncat\s+-e\s+|socket\.socket.*connect)'

  - id: RCE-005
    category: RCE
    description: 编码后的 PowerShell 命令
    pattern: 'powershell(\.exe)?\s+.*-e(nc|ncodedcommand)?\s+[A-Za-z0-9+/=]{40,}'

  - id: NET-001
    category: NET
    description: 上传本地文件到远端
    pattern: '(curl\s+.*(-F|--form|-T|--upload-file)|scp\s+|rsync\s+.*@)'

  - id: NET-002
    category: NET
    description: 关闭或篡改防火墙
    pattern: '(netsh\s+advfirewall\s+set.*state\s+off|Set-NetFirewallProfile.*-Enabled\s+False)'

  - id: DEL-001
    category: DEL
    description: 递归强制删除根目录或系统目录
    pattern: '(rm\s+-[a-z]*r[a-z]*f?|rmdir\s+/s|Remove-Item\s+.*-Recurse).{0,40}(/|\\|[A-Za-z]:\\)\s*(\*)?\s*$'

  - id: DEL-002
    category: DEL
    description: 格式化磁盘
    pattern: '(format\s+[a-zA-Z]:|diskpart|Clear-Disk|Format-Volume)'

  - id: DEL-003
    category: DEL
    description: 删除系统还原点或卷影副本，阻止回滚
    pattern: '(vssadmin\s+delete\s+shadows|wbadmin\s+delete|Remove-ComputerRestorePoint)'

  - id: SYS-001
    category: SYS
    description: 关闭系统安全机制
    pattern: '(Set-MpPreference.*Disable|bcdedit.*(nointegritychecks|testsigning)|reg\s+add.*DisableAntiSpyware)'

  - id: SYS-002
    category: SYS
    description: 修改启动配置
    pattern: '(bcdedit\s+/set|bootrec\s+/)'

  - id: PAY-001
    category: PAY
    description: 涉及支付、转账、扣款
    pattern: '(支付|付款|转账|下单|扣款|充值|购买|提交订单|pay\b|transfer\s+funds|checkout|confirm\s+payment)'

  - id: WEB-001
    category: DEL
    description: 网页上的不可逆操作（删除账号、清空数据、解绑）
    pattern: '(确认删除|删除账号|注销账号|注销账户|清空数据|清空回收站|解绑|永久删除|delete\s+account|deactivate\s+account)'
